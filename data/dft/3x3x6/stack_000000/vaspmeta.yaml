title: NbO2F 3x3x6 stacking 000000
description: Full geometry optimisation of a 3x3x6 supercell of NbO2F
notes: >-
  Homochiral stacking of the P3_121 helix: the ground state (orbit 11) tiled twice
  along z, with no twin boundaries. The reference for the other stackings, which
  use identical settings in the same cell.
  The k-point mesh folds onto the Monkhorst-Pack 2x2x2 points of the 3x3x3 set.
  Starting structure from methods/dft/build_stackings.py in the data repository.
status: finished
