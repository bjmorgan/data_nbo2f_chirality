title: NbO2F 3x3x6 achiral_06
description: Full geometry optimisation of a 3x3x6 supercell of NbO2F
notes: >-
  Achiral arrangement (P-1) with cis and OOF order everywhere. Its six three-plane
  windows are the 3x3x3 orbits 9 9 9 9 9 9; it contains no P3_121 blocks. The
  lexicographically first labelling of its class, generated by
  methods/dft/enumerate_3x3x6.py in the data repository.
  The k-point mesh folds onto the Monkhorst-Pack 2x2x2 points of the 3x3x3 set.
status: finished
