title: NbO2F 3x3x3 config_072
description: Full geometry optimisation of a 3x3x3 supercell of NbO2F
notes: >-
  Obeys both ordering rules (cis-NbO4F2 at every Nb and period-three O-O-F order on
  every chain): the representative of orbit 11 (P3_121). Orbit 11 is represented
  twice in this set, in two settings (configs 063 and 072).
status: finished
