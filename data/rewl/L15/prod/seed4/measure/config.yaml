# REWL L=15 PRODUCTION (FSS series). Window layout = validated
# profile2 (deep-GS truncated, 2.5 eV floor so no over-confinement
# freeze; band GS+65..120 well inside range; converged to a clean
# stitch, overlap std 0.19, Tc 485.3, latent 46.9). Production recipe:
# flatness + f_continuous + multiple 50, full convergence (1e-12).
# Too long for one 24 h slot -> chain with `rewl resume --extra-cycles N`
# (plain `rewl resume` no-ops until the resume cycle-count fix lands).
random_seed: 4

system:
  n_sc: 15
  ce: paircut9_5_5_ardr_n96

windows:
  energy_spacing: 0.1
  list:
    - [-117905.0, -117902.5, 2]
