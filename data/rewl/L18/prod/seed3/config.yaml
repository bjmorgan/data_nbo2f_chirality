# REWL L=18 PRODUCTION (5 seeds). Validated by the L18 profile: the
# 68-window layout (GS+50..GS+270, graduated 3->12 eV, 50% overlap,
# 1/2/1 walker banding, 107 cores) brackets the band cleanly
# (ordered ~GS+125, disordered ~GS+209, latent ~84 eV). Production
# changes vs profile: fill_factor_limit 1e-12 and a high n_trials
# ceiling for chain-and-monitor -- stop when the coexistence T_c is
# sigma-robust (default-smoothing equal-area agrees with band-scale),
# not at budget. Recipe: flatness + f_continuous + multiple 50.
