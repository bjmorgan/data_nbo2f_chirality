# Environment used to validate this bundle: from it, `make` regenerates every
# deposited-era CSV bit-for-bit. Minor dependency drift will not change any
# result but may perturb the last floating-point digit; pin as below for exact
# reproduction. Python comes from conda; the rest are pinned from PyPI so the
# versions are explicit (icet is also available on conda-forge if a prebuilt
# binary is preferred -- move the `icet==3.2` line up into the conda section).
name: nbo2f-chirality
channels:
  - conda-forge
dependencies:
  - python=3.12.3
  - pip
  - pip:
      - numpy==2.3.5
      - pandas==2.2.3
      - scipy==1.17.1
      - matplotlib==3.10.7
      - ase==3.28.0
      - icet==3.2                # ships the `mchammer` package too
      - mchammer-pt==0.27.1      # reweight/stitch CLIs + coexistence analysis
      - figure_formatting @ git+https://github.com/bjmorgan/figure_formatting.git@bca05929c29ae6ee3ccb21101833f7eb6e203cd9
      # DFT order-parameter pipeline + structure/CE figures:
      - chainorder==0.2.0                                     # PyPI == tag v0.2.0
      - nbo2f_analysis @ git+https://github.com/bjmorgan/nbo2f_analysis.git@5782decd2768ae40defe1121086bc9aecbb1ef63
      - hofmann==0.20.0                                       # renders the structure figures
      # Cluster-expansion methods scripts (methods/cluster_expansion/):
      - scikit-learn==1.6.1      # ARDR fit + posterior committee
      - trainstation==1.1        # cross-validation for hyperparameter selection
      - mchammer-moves==0.6.0    # custom moves for the active-learning PT run

# Before the final DOI, the two git-pinned deps want proper releases:
#   figure_formatting, nbo2f_analysis -- not on PyPI; tag + Zenodo.
